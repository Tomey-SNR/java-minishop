name: MiniShop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: minishop
          POSTGRES_USER: minishop
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U minishop -d minishop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5433/minishop
      DB_USERNAME: minishop
      DB_PASSWORD: ci_test_password
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@minishop.local
      ADMIN_PASSWORD: ci_admin_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create environment file
        run: |
          cat > .env <<EOF
          DB_URL=${DB_URL}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          ADMIN_USERNAME=${ADMIN_USERNAME}
          ADMIN_EMAIL=${ADMIN_EMAIL}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          EOF

      - name: Run tests
        run: mvn -B clean test
