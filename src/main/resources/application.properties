spring.application.name=minishop

# Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minishop}
spring.datasource.username=${DB_USERNAME:minishop}
spring.datasource.password=${DB_PASSWORD:minishop_dev_password}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true