<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | MiniShop</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin-users.css}">
</head>
<body>

<header>
    <div class="container">
        <h1><a th:href="@{/}">MiniShop - Admin</a></h1>

        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/products}">Products</a>
            <a th:href="@{/admin/users}">User Management</a>

            <form th:action="@{/logout}" method="post">
                <button type="submit">Logout</button>
            </form>
        </nav>
    </div>
</header>

<main class="container">
    <section class="content">

        <h2>Registered Users</h2>

        <p th:if="${successMessage}"
           th:text="${successMessage}"
           class="success-message"></p>

        <p th:if="${errorMessage}"
           th:text="${errorMessage}"
           class="validation-error"></p>

        <p>
            Total registered accounts:
            <strong th:text="${#lists.size(users)}">0</strong>
        </p>

        <div th:if="${#lists.isEmpty(users)}">
            <p>No registered users found.</p>
        </div>

        <div class="table-container"
             th:unless="${#lists.isEmpty(users)}">

            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id()}">1</td>
                    <td th:text="${user.username()}">username</td>
                    <td th:text="${user.email()}">user@example.com</td>
                    <td>
                        <span th:text="${user.role()}"
                              th:class="${user.role().name() == 'ADMIN'} ? 'admin-role' : 'user-role'">
                            USER
                        </span>
                    </td>
                    <td>
                        <form th:if="${user.username() != username}"
                              th:action="@{/admin/users/{id}/delete(id=${user.id()})}"
                              method="post"
                              onsubmit="return confirm('Are you sure you want to delete this account?');">

                            <button type="submit" class="delete-button">
                                Delete
                            </button>
                        </form>

                        <span th:if="${user.username() == username}">
                            Current account
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>

    </section>
</main>

<footer>
    <div class="container">
        <p>&copy; 2026 MiniShop. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
