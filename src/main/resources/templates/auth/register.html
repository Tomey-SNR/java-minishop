<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MiniShop</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<header>
    <div class="container">
        <h1><a th:href="@{/}">MiniShop</a></h1>

        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/products}">Products</a>
            <a th:href="@{/login}">Log in</a>
        </nav>
    </div>
</header>

<main class="auth-container">
    <h2>Create an account</h2>
    <p>Register to start shopping at MiniShop.</p>

    <div th:if="${registrationError}" class="auth-message auth-error"
         th:text="${registrationError}">
    </div>

    <form class="auth-form"
          th:action="@{/register}"
          th:object="${registrationForm}"
          method="post">

        <div>
            <label for="username">Username</label>
            <input
                    type="text"
                    id="username"
                    th:field="*{username}"
                    autocomplete="username"
                    required>
            <p class="auth-error"
               th:if="${#fields.hasErrors('username')}"
               th:errors="*{username}">
            </p>
        </div>

        <div>
            <label for="email">Email</label>
            <input
                    type="email"
                    id="email"
                    th:field="*{email}"
                    autocomplete="email"
                    required>
            <p class="auth-error"
               th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}">
            </p>
        </div>

        <div>
            <label for="password">Password</label>
            <input
                    type="password"
                    id="password"
                    th:field="*{password}"
                    autocomplete="new-password"
                    required>
            <p class="auth-error"
               th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}">
            </p>
        </div>
        
        <div>
            <label for="confirmPassword">Confirm Password</label>
            <input type="password"
                   id="confirmPassword"
                   th:field="*{confirmPassword}"
                   placeholder="Retype your password"
                   required>

            <p th:if="${#fields.hasErrors('confirmPassword')}"
               th:errors="*{confirmPassword}"
               class="validation-error"></p>
        </div>

        <button type="submit">Create account</button>
    </form>

    <p class="auth-link">
        Already have an account?
        <a th:href="@{/login}">Log in</a>
    </p>
</main>

</body>
</html>
