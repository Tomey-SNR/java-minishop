<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniShop - Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header">
    <div class="container">
        <a href="/" class="logo">MiniShop</a>

        <nav class="main-navigation">
            <a href="/">Home</a>
            <a href="#products">Products</a>
            <a href="#about">About</a>
        </nav>
    </div>
</header>

<main>
    <section class="hero">
        <div class="container">
            <h1>Welcome to MiniShop</h1>
            <p>Discover great products at great prices.</p>
            <a href="#products" class="button">Explore Products</a>
        </div>
    </section>

    <section id="products" class="products-section">
        <div class="container">
            <h2>Our Products</h2>
            <p>Our product collection is coming soon.</p>
        </div>
    </section>

    <section id="about" class="about-section">
        <div class="container">
            <h2>About MiniShop</h2>
            <p>
                MiniShop is a simple online store built with
                Java, Spring Boot and Thymeleaf.
            </p>
        </div>
    </section>
</main>

<footer class="site-footer">
    <div class="container">
        <p>&copy; 2026 MiniShop. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
