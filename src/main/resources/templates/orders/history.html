<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - MiniShop</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/orders.css}">
</head>
<body>

<header>
    <div class="container">
        <h1><a th:href="@{/}">MiniShop</a></h1>

        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/products}">Products</a>

            <a th:if="${username != null and !isAdmin}" th:href="@{/orders}">
                My Orders
            </a>

            <span th:if="${username != null}" class="account-info">
        Welcome, <strong th:text="${username}">username</strong>
        <span th:if="${isAdmin}" class="role-label">ADMIN</span>
        <span th:unless="${isAdmin}" class="role-label">USER</span>
    </span>

            <a th:if="${isAdmin}" th:href="@{/admin/users}">User Management</a>
            <a th:if="${isAdmin}" th:href="@{/admin/orders}">Order Management</a>

            <form th:if="${username != null}" th:action="@{/logout}" method="post">
                <button type="submit">Logout</button>
            </form>

            <span th:unless="${username != null}">
        <a th:href="@{/login}">Log in</a>
        <a th:href="@{/register}">Register</a>
    </span>
        </nav>
    </div>
</header>

<main class="orders-container">

    <h1>My Orders</h1>

    <div th:if="${successMessage}" class="success-message"
         th:text="${successMessage}"></div>

    <div th:if="${errorMessage}" class="error-message"
         th:text="${errorMessage}"></div>

    <div th:if="${#lists.isEmpty(orders)}" class="empty-orders">
        <h2>No orders yet</h2>
        <p>You haven't purchased any products.</p>
        <a th:href="@{/products}" class="primary-button">
            Browse Products
        </a>
    </div>

    <div th:unless="${#lists.isEmpty(orders)}" class="orders-list">

        <article class="order-card" th:each="order : ${orders}">

            <div class="order-header">
                <div>
                    <h2>
                        Order #
                        <span th:text="${order.id}"></span>
                    </h2>

                    <p th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}"></p>
                </div>

                <span class="order-status"
                      th:text="${order.status}"></span>
            </div>

            <div class="order-items">

                <div class="order-item" th:each="item : ${order.items}">

                    <div>
                        <h3 th:text="${item.productName}">Product name</h3>

                        <p>
                            Quantity:
                            <span th:text="${item.quantity}"></span>
                        </p>

                        <p>
                            Unit price:
                            <span th:text="${#numbers.formatDecimal(item.purchasePrice, 1, 2)}"></span>
                        </p>
                    </div>

                    <strong>
                        <span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}"></span>
                    </strong>

                </div>

            </div>

            <div class="order-total">
                Total:
                <strong>
                    <span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span>
                </strong>
            </div>

        </article>

    </div>

    <a th:href="@{/products}" class="back-link">
        Back to Products
    </a>

</main>

</body>
</html>
