<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form | MiniShop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <div class="container">
        <h1><a th:href="@{/}">MiniShop</a></h1>
        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/products}">Products</a>
        </nav>
    </div>
</header>

<main class="container">
    <section class="content">
        <h2 th:text="${product.id == null ? 'Add New Product' : 'Edit Product'}">
            Product Form
        </h2>

        <form th:object="${product}"
              th:action="${product.id == null} ? @{/products} : @{/products/{id}(id=${product.id})}"
              method="post">

            <div>
                <label for="name">Product Name</label>
                <input type="text" id="name" th:field="*{name}">
                <p th:if="${#fields.hasErrors('name')}"
                   th:errors="*{name}"></p>
            </div>

            <div>
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}"></textarea>
                <p th:if="${#fields.hasErrors('description')}"
                   th:errors="*{description}"></p>
            </div>

            <div>
                <label for="price">Price (€)</label>
                <input type="number"
                       id="price"
                       step="0.01"
                       min="0.01"
                       th:field="*{price}">
                <p th:if="${#fields.hasErrors('price')}"
                   th:errors="*{price}"></p>
            </div>

            <div>
                <label for="stockQuantity">Stock Quantity</label>
                <input type="number"
                       id="stockQuantity"
                       min="0"
                       th:field="*{stockQuantity}">
                <p th:if="${#fields.hasErrors('stockQuantity')}"
                   th:errors="*{stockQuantity}"></p>
            </div>

            <button type="submit">Save Product</button>
            <a th:href="@{/products}">Cancel</a>
        </form>
    </section>
</main>

<footer>
    <div class="container">
        <p>&copy; 2026 MiniShop. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
