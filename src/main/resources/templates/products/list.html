<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - MiniShop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <div class="container">
        <h1><a th:href="@{/}">MiniShop</a></h1>
        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/products}">Products</a>
        </nav>
    </div>
</header>

<main class="container content">

    <h2>Our Products</h2>

    <div class="catalog-actions">

        <form th:action="@{/products}" method="get" class="catalog-filter-form">

            <div class="search-input-group">
                <label for="product-search" class="visually-hidden">
                    Search products
                </label>

                <input type="search"
                       id="product-search"
                       name="search"
                       placeholder="Search products..."
                       th:value="${search}">

                <button type="submit">Search</button>

                <a th:href="@{/products(minPrice=${minPrice},maxPrice=${maxPrice})}"
                   class="clear-search">
                    Clear search
                </a>
            </div>

            <div class="price-input-group">
                <label for="min-price">Minimum price</label>

                <input type="number"
                       id="min-price"
                       name="minPrice"
                       min="0.01"
                       step="0.01"
                       placeholder="Min"
                       th:value="${minPrice}">

                <label for="max-price">Maximum price</label>

                <input type="number"
                       id="max-price"
                       name="maxPrice"
                       min="0.01"
                       step="0.01"
                       placeholder="Max"
                       th:value="${maxPrice}">

                <button type="submit">Filter</button>

                <a th:href="@{/products(search=${search})}"
                   class="clear-search">
                    Clear price
                </a>
            </div>

            <a th:href="@{/products}" class="clear-search">
                Clear all filters
            </a>

        </form>

        <p th:if="${priceError}"
           th:text="${priceError}"
           class="validation-error">
        </p>

        <a class="button add-product-button" th:href="@{/products/new}">
            Add New Product
        </a>

    </div>

    <div th:if="${#lists.isEmpty(products)}">
        <p>No products found.</p>
    </div>

    <table th:unless="${#lists.isEmpty(products)}">
        <thead>
        <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.name}"></td>
            <td th:text="${product.description}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.stockQuantity}"></td>
            <td>
                <a th:href="@{/products/{id}(id=${product.id})}">Details</a>
                |
                <a th:href="@{/products/{id}/edit(id=${product.id})}">Edit</a>

                <form th:action="@{/products/{id}/delete(id=${product.id})}"
                      method="post"
                      class="inline-form"
                      onsubmit="return confirm('Are you sure you want to delete this product?');">

                    <button type="submit" class="delete-button">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</main>

<footer>
    <div class="container">
        <p>&copy; 2026 MiniShop. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
